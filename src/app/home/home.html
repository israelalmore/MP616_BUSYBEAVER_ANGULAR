<main class="home">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="Busy Beaver, inicio">
      <svg viewBox="0 0 40 40" role="img" aria-label="Cruz farmacéutica">
        <rect x="2" y="2" width="36" height="36" rx="11" class="brand-mark" />
        <path d="M17 9h6v8h8v6h-8v8h-6v-8H9v-6h8z" class="brand-cross" />
      </svg>
      <span class="brand-copy">
        <strong>Busy Beaver</strong>
        <small>GESTIÓN DE DATOS SANITARIOS</small>
      </span>
    </a>
    <nav aria-label="Navegación principal">
      @for (item of navigation; track item.path) {
        <a [routerLink]="item.path">{{ item.label }}</a>
      }
    </nav>
  </header>

  <section class="welcome" aria-labelledby="welcome-title">
    <p class="eyebrow">INICIO</p>
    <h1 id="welcome-title">Gestión de datos sanitarios</h1>
    <p class="intro">Selecciona una opción del menú para continuar.</p>
    <button type="button" (click)="isExploring.set(!isExploring())">
      {{ isExploring() ? 'Cerrar ayuda' : 'Ayuda de navegación' }}
    </button>
    @if (isExploring()) {
      <p class="message" role="status">
        Usa el menú superior para acceder a las secciones disponibles.
      </p>
    }
  </section>
</main>
